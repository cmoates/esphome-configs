esphome:
  name: ${hostname}
  friendly_name: ${hostname}
  min_version: 2025.11.0

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ${dns_domain}
  use_address: ${hostname}${dns_domain}

prometheus:
web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
