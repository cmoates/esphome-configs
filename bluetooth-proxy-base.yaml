esphome:
  name: ${hostname}
  friendly_name: ${hostname}

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ${dns_domain}
  use_address: ${hostname}${dns_domain}
  # Stability fixes for marginal signals
  reboot_timeout: 0s
  power_save_mode: none

prometheus:
web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true
  id: ble_proxy_id

logger:
  level: DEBUG

network_logging:
  - service: syslog
    address: syslog${dns_domain}
    port: 514
    protocol: UDP
    tag: esphome

debug:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s # Stop the 15-minute reboot cycle

ota:
  - platform: esphome
    on_begin:
      then:
        - esp32_ble_tracker.stop_scan: 
        # For the proxy, we use a small lambda to set it to inactive
        - lambda: 'id(ble_proxy_id).set_active(false);'
    on_end:
      then:
        # Optional: ensure it comes back if the OTA fails or finishes
        - esp32_ble_tracker.start_scan: 
        - lambda: 'id(ble_proxy_id).set_active(true);'

# Diagnostic sensors for all proxies
sensor:
  - platform: wifi_signal
    name: "${hostname} WiFi Signal"
    update_interval: 60s
    
  - platform: uptime
    name: "${hostname} Uptime"

  # Corrected platform for ESP-IDF
  - platform: debug
    free:
      name: "${hostname} Free Heap"

text_sensor:
  - platform: wifi_info
    bssid:
      name: "${hostname} BSSID"
      
  - platform: debug
    device:
      name: "${hostname} Reset Reason"
