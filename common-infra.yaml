# common-infrastructure.yaml
esphome:
  name: ${hostname}
  friendly_name: ${hostname}
  min_version: 2025.11.0

# Framework & Chip Basics
esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

# Network Standards
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ${dns_domain}
  use_address: ${hostname}${dns_domain}
  reboot_timeout: 0s
  power_save_mode: none

# Management Stack
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

udp:
  addresses:
    - syslog${dns_domain}

time:
  - platform: sntp
  id: sntp_time


logger:
  level: DEBUG

syslog:
  id: syslog_logger
  port: 514
  # The 'tag' is called 'tag' here as well, helps Alloy filter
  tag: esphome
  level: DEBUG
  # Set the facility (16 is local0, the default)
  facility: 16

ota:
  - platform: esphome
    on_begin:
      then:
        - esp32_ble_tracker.stop_scan: 
        # For the proxy, we use a small lambda to set it to inactive
        - lambda: 'id(ble_proxy_id).set_active(false);'
    on_end:
      then:
        # Optional: ensure it comes back if the OTA fails or finishes
        - esp32_ble_tracker.start_scan: 
        - lambda: 'id(ble_proxy_id).set_active(true);'

prometheus:
web_server:
  port: 80

debug:

# Diagnostic sensors for all proxies
sensor:
  - platform: wifi_signal
    name: "${hostname} WiFi Signal"
    update_interval: 60s
    
  - platform: uptime
    name: "${hostname} Uptime"

  # Corrected platform for ESP-IDF
  - platform: debug
    free:
      name: "${hostname} Free Heap"

text_sensor:
  - platform: wifi_info
    bssid:
      name: "${hostname} BSSID"
      
  - platform: debug
    device:
      name: "${hostname} Reset Reason"
